
<style>
*{box-sizing:border-box;margin:0;padding:0}
.wrap{padding:0 0 24px;font-size:13px;color:var(--color-text-primary)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.layer-btn{padding:4px 12px;border-radius:20px;border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);cursor:pointer;font-size:12px;transition:all .15s}
.layer-btn.active{background:var(--color-text-primary);color:var(--color-background-primary);border-color:var(--color-text-primary)}
.sort-wrap{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--color-text-secondary)}
.sort-wrap select{font-size:12px;padding:4px 8px;border-radius:6px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-primary);cursor:pointer}
.comp-row{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);margin-bottom:8px;overflow:hidden;transition:border-color .15s}
.comp-row:hover{border-color:var(--color-border-secondary)}
.comp-head{display:grid;grid-template-columns:180px 1fr 90px 90px 90px 80px;gap:0;align-items:center;padding:10px 14px;cursor:pointer;background:var(--color-background-primary)}
.comp-head:hover{background:var(--color-background-secondary)}
.c-name{font-weight:500;font-size:13px;display:flex;align-items:center;gap:7px}
.layer-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.c-options{display:flex;gap:4px;flex-wrap:wrap}
.opt-pill{padding:2px 7px;border-radius:10px;font-size:11px;font-weight:500;white-space:nowrap}
.op-paid{background:#E6F1FB;color:#0C447C}
.op-oss{background:#EAF3DE;color:#27500A}
.op-free{background:#EEEDFE;color:#3C3489}
.c-cost{font-size:12px;color:var(--color-text-secondary)}
.c-complexity,.c-perf,.c-mvp{display:flex;align-items:center;gap:3px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--color-border-secondary)}
.dot.on-perf{background:#185FA5}
.dot.on-mvp{background:#639922}
.dot.on-cx{background:#BA7517}
.chev{margin-left:auto;font-size:11px;color:var(--color-text-tertiary);transition:transform .2s}
.comp-row.open .chev{transform:rotate(180deg)}
.comp-body{display:none;border-top:0.5px solid var(--color-border-tertiary);padding:12px 14px;background:var(--color-background-secondary)}
.comp-row.open .comp-body{display:block}
.body-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.option-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px 12px}
.option-card.winner-perf{border-left:3px solid #185FA5;border-radius:0 var(--border-radius-md) var(--border-radius-md) 0}
.option-card.winner-mvp{border-left:3px solid #639922;border-radius:0 var(--border-radius-md) var(--border-radius-md) 0}
.oc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.oc-name{font-size:13px;font-weight:500}
.oc-badges{display:flex;gap:4px;flex-wrap:wrap}
.badge{display:inline-block;padding:2px 6px;border-radius:6px;font-size:10px;font-weight:500}
.b-paid{background:#E6F1FB;color:#0C447C}
.b-oss{background:#EAF3DE;color:#27500A}
.b-free{background:#EEEDFE;color:#3C3489}
.b-perf{background:#E6F1FB;color:#0C447C}
.b-mvp{background:#EAF3DE;color:#27500A}
.oc-cost{font-size:11px;color:var(--color-text-secondary);margin-bottom:4px}
.oc-note{font-size:11px;color:var(--color-text-secondary);line-height:1.5}
.col-hdr{display:grid;grid-template-columns:180px 1fr 90px 90px 90px 80px;gap:0;padding:6px 14px;margin-bottom:4px}
.col-hdr span{font-size:11px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.04em}
.hidden{display:none}
.count-badge{font-size:11px;padding:2px 7px;border-radius:10px;background:var(--color-background-tertiary);color:var(--color-text-secondary)}
</style>

<div class="wrap">
<h2 class="sr-only">LifeOS technology comparison across 17 components with performance and cost ratings</h2>

<div class="toolbar">
  <button class="layer-btn active" data-layer="all" onclick="filterLayer(this)">All (17)</button>
  <button class="layer-btn" data-layer="edge" onclick="filterLayer(this)">Edge</button>
  <button class="layer-btn" data-layer="compute" onclick="filterLayer(this)">Compute</button>
  <button class="layer-btn" data-layer="ai" onclick="filterLayer(this)">AI / ML</button>
  <button class="layer-btn" data-layer="data" onclick="filterLayer(this)">Data</button>
  <button class="layer-btn" data-layer="async" onclick="filterLayer(this)">Async</button>
  <button class="layer-btn" data-layer="security" onclick="filterLayer(this)">Security</button>
  <button class="layer-btn" data-layer="obs" onclick="filterLayer(this)">Observability</button>
  <div class="sort-wrap">
    <span>Sort by</span>
    <select onchange="sortRows(this.value)">
      <option value="default">Default</option>
      <option value="perf">Performance</option>
      <option value="mvp">MVP cost</option>
      <option value="cx">Complexity</option>
    </select>
  </div>
</div>

<div class="col-hdr">
  <span>Component</span>
  <span>Options</span>
  <span>Min cost</span>
  <span>Perf score</span>
  <span>MVP score</span>
  <span>Complexity</span>
</div>

<div id="rows-wrap"></div>
</div>

<script>
const LAYERS = {edge:'#1D9E75',compute:'#185FA5',ai:'#BA7517',data:'#0F6E56',async:'#993C1D',security:'#534AB7',obs:'#5F5E5A'};

const data = [
  {id:'cdn',layer:'edge',name:'CDN',minCost:'$0',perf:4,mvp:5,cx:1,
   options:[
    {name:'Cloudflare',type:'free',cost:'$0 free forever',note:'Best free tier; WAF + DDoS included. Zero setup friction.',perf:false,mvp:true},
    {name:'AWS CloudFront',type:'paid',cost:'~$0.008/GB',note:'450+ PoPs; Lambda@Edge; best for AWS-native stacks.',perf:true,mvp:false},
    {name:'Nginx (self-hosted)',type:'oss',cost:'$0 + server',note:'No global PoPs but fine behind Cloudflare.',perf:false,mvp:false},
   ]},
  {id:'dns',layer:'edge',name:'DNS & routing',minCost:'$0',perf:4,mvp:5,cx:1,
   options:[
    {name:'Cloudflare DNS',type:'free',cost:'$0',note:'Fastest anycast DNS globally; change nameservers in GoDaddy in 5 min.',perf:false,mvp:true},
    {name:'AWS Route 53',type:'paid',cost:'$0.50/zone/mo',note:'Latency-based routing + health-check failover; best for AWS.',perf:true,mvp:false},
    {name:'GoDaddy DNS',type:'free',cost:'$0 (with domain)',note:'Already owned; no CDN/WAF. Fine for dev/staging.',perf:false,mvp:false},
   ]},
  {id:'waf',layer:'edge',name:'Web app firewall',minCost:'$0',perf:4,mvp:5,cx:1,
   options:[
    {name:'Cloudflare WAF',type:'free',cost:'$0 (free plan)',note:'OWASP rules + Bot Fight Mode free. One toggle to enable.',perf:false,mvp:true},
    {name:'AWS WAF',type:'paid',cost:'$5/ACL/mo + rules',note:'Programmatic rules; CloudWatch integration; auto-scaling.',perf:true,mvp:false},
    {name:'ModSecurity',type:'oss',cost:'$0 + server',note:'Industry-standard OWASP CRS; needs ops expertise.',perf:false,mvp:false},
   ]},
  {id:'apigw',layer:'compute',name:'API gateway',minCost:'$0',perf:4,mvp:5,cx:2,
   options:[
    {name:'Nginx (reverse proxy)',type:'oss',cost:'$0 on VPS',note:'Already on Hostinger VPS. Zero extra cost. Add rate limiting with limit_req.',perf:false,mvp:true},
    {name:'AWS API Gateway',type:'paid',cost:'$3.50/M calls',note:'Native Lambda; usage plans per user; 1M free/mo.',perf:true,mvp:false},
    {name:'Kong Gateway OSS',type:'oss',cost:'$0 + server',note:'Rich plugin ecosystem; JWT auth plugin; self-hostable.',perf:false,mvp:false},
   ]},
  {id:'compute',layer:'compute',name:'Serverless compute',minCost:'$0',perf:5,mvp:5,cx:2,
   options:[
    {name:'Gunicorn + Uvicorn (VPS)',type:'oss',cost:'$0 on VPS',note:'Runs on existing Hostinger VPS. 3 workers for 4 GB RAM. Zero extra cost.',perf:false,mvp:true},
    {name:'AWS Lambda',type:'paid',cost:'$0 (1M free/mo)',note:'Provisioned concurrency kills cold starts; scales to 1000+ concurrent.',perf:true,mvp:false},
    {name:'Google Cloud Run',type:'paid',cost:'$0 (2M free/mo)',note:'Fastest cold starts; container-native; easy multi-region.',perf:false,mvp:false},
   ]},
  {id:'llm',layer:'ai',name:'LLM reasoning',minCost:'~$0.00025/call',perf:5,mvp:4,cx:1,
   options:[
    {name:'Claude Haiku (Anthropic)',type:'paid',cost:'~$0.00025/call',note:'Use for intent classification + simple queries. Fastest and cheapest Claude model.',perf:false,mvp:true},
    {name:'Claude Sonnet via Bedrock',type:'paid',cost:'~$0.03/call',note:'Best reasoning quality for complex synthesis. BAA-covered inside AWS boundary.',perf:true,mvp:false},
    {name:'Gemini Flash (Google)',type:'paid',cost:'~$0.075/M tokens',note:'Cheapest capable alternative. $300 free credit to start.',perf:false,mvp:false},
    {name:'Llama 3 (self-hosted)',type:'oss',cost:'$0 model + GPU',note:'Full data control. Needs 8–16 GB GPU RAM. Not viable on 4 GB VPS.',perf:false,mvp:false},
   ]},
  {id:'embed',layer:'ai',name:'Embedding engine',minCost:'$0',perf:5,mvp:4,cx:2,
   options:[
    {name:'sentence-transformers',type:'oss',cost:'$0 (runs on CPU)',note:'Best OSS option. Runs on existing VPS CPU at MVP scale.',perf:false,mvp:true},
    {name:'OpenAI text-embedding-3-small',type:'paid',cost:'~$0.02/M tokens',note:'Highest quality 1536-dim vectors. Best quality/cost ratio of any paid option.',perf:true,mvp:false},
    {name:'Bedrock Titan Embeddings',type:'paid',cost:'~$0.10/M tokens',note:'Stays in AWS boundary. BAA covered. 5× pricier than OpenAI.',perf:false,mvp:false},
   ]},
  {id:'vector',layer:'data',name:'Vector search',minCost:'$0',perf:4,mvp:5,cx:2,
   options:[
    {name:'pgvector (inside Postgres)',type:'oss',cost:'$0 (inside existing DB)',note:'Eliminates a separate service entirely. IVFFlat handles <50M vectors easily.',perf:false,mvp:true},
    {name:'Qdrant (self-hosted)',type:'oss',cost:'$0 + infra',note:'Rust-based; fastest pure vector search. Worth it past 50M vectors.',perf:true,mvp:false},
    {name:'Pinecone',type:'paid',cost:'$0 starter / $70+ prod',note:'Managed; auto-scaling. Easiest to start. Starter is genuinely free.',perf:false,mvp:false},
   ]},
  {id:'db',layer:'data',name:'Relational database',minCost:'$0',perf:5,mvp:5,cx:3,
   options:[
    {name:'PostgreSQL 16 (self-hosted)',type:'oss',cost:'$0 on VPS',note:'On existing Hostinger VPS. pgvector included. Install in 2 minutes.',perf:false,mvp:true},
    {name:'AWS RDS PostgreSQL',type:'paid',cost:'$0 (12mo free tier)',note:'Managed Multi-AZ, PITR backups, auto-scaling storage. Best for production scale.',perf:true,mvp:false},
    {name:'Supabase',type:'paid',cost:'$0 (free tier)',note:'Postgres + auth + storage + REST API in one. Great all-in-one starting point.',perf:false,mvp:false},
   ]},
  {id:'cache',layer:'data',name:'Cache / session store',minCost:'$0',perf:4,mvp:5,cx:2,
   options:[
    {name:'Redis (self-hosted)',type:'oss',cost:'$0 on VPS',note:'Dual-purpose: cache AND Celery broker. Set maxmemory 256mb to cap it hard.',perf:false,mvp:true},
    {name:'AWS ElastiCache',type:'paid',cost:'~$15/mo',note:'Managed cluster mode; Multi-AZ failover; sub-ms latency at scale.',perf:true,mvp:false},
    {name:'Upstash Redis',type:'paid',cost:'$0 (10K cmds/day)',note:'Serverless Redis. Zero ops. Freemium. Great for dev and early MVP.',perf:false,mvp:false},
   ]},
  {id:'storage',layer:'data',name:'Object storage',minCost:'$0',perf:4,mvp:5,cx:1,
   options:[
    {name:'Cloudflare R2',type:'free',cost:'$0 (10 GB free)',note:'Zero egress fees. S3-compatible API (boto3 works unchanged). Best overall value.',perf:false,mvp:true},
    {name:'AWS S3',type:'paid',cost:'$0 (5 GB, 1 yr)',note:'11-nines durability; lifecycle tiering to Glacier; multi-region replication.',perf:true,mvp:false},
    {name:'Backblaze B2',type:'paid',cost:'$0 (10 GB free)',note:'$0.006/GB/mo after free tier. Very cheap. S3-compatible.',perf:false,mvp:false},
   ]},
  {id:'queue',layer:'async',name:'Message queue',minCost:'$0',perf:4,mvp:5,cx:2,
   options:[
    {name:'Redis as Celery broker',type:'oss',cost:'$0 (already on VPS)',note:'Dual-purpose Redis instance. No extra service. Works perfectly at MVP scale.',perf:false,mvp:true},
    {name:'AWS SQS',type:'paid',cost:'$0 (1M free/mo)',note:'Managed; FIFO ordering; dead-letter queues built-in; scales infinitely.',perf:true,mvp:false},
    {name:'RabbitMQ',type:'oss',cost:'$0 + server',note:'AMQP protocol; rich routing topologies; widely understood.',perf:false,mvp:false},
   ]},
  {id:'scheduler',layer:'async',name:'Job scheduler',minCost:'$0',perf:4,mvp:5,cx:2,
   options:[
    {name:'Celery Beat',type:'oss',cost:'$0 (part of Celery)',note:'Built-in. Cron + interval scheduling. Per-user timezone briefing jobs.',perf:false,mvp:true},
    {name:'AWS EventBridge',type:'paid',cost:'$1.10/M invocations',note:'Per-user cron at any scale. Zero operational overhead. Native AWS.',perf:true,mvp:false},
    {name:'Inngest',type:'paid',cost:'$0 (50K runs/mo)',note:'Best developer experience. Event-driven jobs with retries and observability.',perf:false,mvp:false},
   ]},
  {id:'push',layer:'async',name:'Push notifications',minCost:'$0',perf:4,mvp:5,cx:1,
   options:[
    {name:'Firebase FCM',type:'free',cost:'$0 forever',note:'Completely free. Handles iOS APNs + Android. firebase-admin Python SDK.',perf:false,mvp:true},
    {name:'AWS SNS Mobile Push',type:'paid',cost:'$0 (1M free/mo)',note:'Managed scale; integrates with SQS for guaranteed delivery ordering.',perf:true,mvp:false},
    {name:'OneSignal',type:'paid',cost:'$0 (10K subscribers)',note:'Dashboard + segmentation + analytics. Easiest no-code setup.',perf:false,mvp:false},
   ]},
  {id:'auth',layer:'security',name:'Auth / identity',minCost:'$0',perf:4,mvp:5,cx:1,
   options:[
    {name:'Supabase Auth',type:'free',cost:'$0 (50K MAU)',note:'Full Postgres-backed auth. Social login. MFA. JWT verified with python-jose.',perf:false,mvp:true},
    {name:'AWS Cognito',type:'paid',cost:'$0 (50K MAU)',note:'Native JWT for API Gateway. Scales to millions MAU. BAA available.',perf:true,mvp:false},
    {name:'Clerk',type:'paid',cost:'$0 (10K MAU)',note:'Best DX. Beautiful pre-built UI components. Newest option in the space.',perf:false,mvp:false},
   ]},
  {id:'errors',layer:'obs',name:'Error tracking',minCost:'$0',perf:4,mvp:5,cx:1,
   options:[
    {name:'Sentry free tier',type:'free',cost:'$0 (5K errors/mo)',note:'5K errors/month covers the entire MVP phase. Best SDK and source maps.',perf:false,mvp:true},
    {name:'Sentry Team plan',type:'paid',cost:'$26/mo',note:'Release health; performance monitoring; unlimited members.',perf:true,mvp:false},
    {name:'GlitchTip (self-hosted)',type:'oss',cost:'$0 + server',note:'Sentry-compatible OSS. Existing Sentry SDK works unchanged.',perf:false,mvp:false},
   ]},
  {id:'llmobs',layer:'obs',name:'LLM observability',minCost:'$0',perf:5,mvp:4,cx:1,
   options:[
    {name:'LangSmith',type:'paid',cost:'$0 (5K traces/day)',note:'Best-in-class for LangChain. Prompt versioning + eval suite. Free dev tier.',perf:true,mvp:true},
    {name:'LangFuse (self-hosted)',type:'oss',cost:'$0 + server',note:'OSS LangSmith alternative. Reuses existing Postgres DB. Full trace detail.',perf:false,mvp:false},
    {name:'Helicone',type:'paid',cost:'$0 (10K req/mo)',note:'Proxy-based — zero code changes to add LLM tracing to any provider.',perf:false,mvp:false},
   ]},
];

let activeLayer = 'all';
let sortKey = 'default';

function dots(n, cls) {
  return Array.from({length:5},(_,i)=>`<div class="dot${i<n?' '+cls:''}"></div>`).join('');
}

function render() {
  let rows = [...data];
  if (activeLayer !== 'all') rows = rows.filter(r => r.layer === activeLayer);
  if (sortKey === 'perf') rows.sort((a,b) => b.perf - a.perf);
  else if (sortKey === 'mvp') rows.sort((a,b) => b.mvp - a.mvp);
  else if (sortKey === 'cx') rows.sort((a,b) => a.cx - b.cx);

  const wrap = document.getElementById('rows-wrap');
  wrap.innerHTML = rows.map(r => {
    const col = LAYERS[r.layer] || '#888';
    const optPills = r.options.map(o => {
      const cls = o.type==='oss'?'op-oss':o.type==='free'?'op-free':'op-paid';
      const label = o.type==='oss'?'OSS':o.type==='free'?'Free':o.name.split(' ')[0];
      return `<span class="opt-pill ${cls}">${label}</span>`;
    }).join('');

    const optCards = r.options.map(o => {
      const wcls = o.perf ? 'winner-perf' : o.mvp ? 'winner-mvp' : '';
      const tb = o.type==='oss'?'b-oss':o.type==='free'?'b-free':'b-paid';
      const tl = o.type==='oss'?'Open source':o.type==='free'?'Free':'Paid';
      const winBadge = o.perf ? '<span class="badge b-perf">Top performance</span>' : o.mvp ? '<span class="badge b-mvp">Best for MVP</span>' : '';
      return `<div class="option-card ${wcls}">
        <div class="oc-head">
          <span class="oc-name">${o.name}</span>
          <div class="oc-badges"><span class="badge ${tb}">${tl}</span>${winBadge}</div>
        </div>
        <div class="oc-cost">${o.cost}</div>
        <div class="oc-note">${o.note}</div>
      </div>`;
    }).join('');

    return `<div class="comp-row" data-layer="${r.layer}" id="row-${r.id}">
      <div class="comp-head" onclick="toggle('${r.id}')">
        <div class="c-name">
          <div class="layer-dot" style="background:${col}"></div>
          ${r.name}
        </div>
        <div class="c-options">${optPills}</div>
        <div class="c-cost">${r.minCost}</div>
        <div class="c-perf">${dots(r.perf,'on-perf')}</div>
        <div class="c-complexity">${dots(r.mvp,'on-mvp')}</div>
        <div class="c-complexity" style="justify-content:flex-end">${dots(5-r.cx+1,'on-cx')}<span class="chev">▼</span></div>
      </div>
      <div class="comp-body">
        <div class="body-grid">${optCards}</div>
      </div>
    </div>`;
  }).join('');
}

function toggle(id) {
  document.getElementById('row-'+id).classList.toggle('open');
}

function filterLayer(el) {
  document.querySelectorAll('.layer-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  activeLayer = el.dataset.layer;
  render();
}

function sortRows(v) {
  sortKey = v;
  render();
}

render();
</script>
